  <path d="M 21 10 C 27 6 34 3 40 3" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Right Leaf -->
  <path d="M 20 12 C 30 12 48 14 54 22 C 46 23 34 19 20 12 Z" fill="#1E824C" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
