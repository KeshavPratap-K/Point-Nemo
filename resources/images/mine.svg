<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Diagonal Spikes -->
  <line x1="4" y1="4" x2="16" y2="16" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="16" y2="4" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Orthogonal Spikes -->
  <line x1="10" y1="2" x2="10" y2="18" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="2" y1="10" x2="18" y2="10" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Main Body -->
  <circle cx="10" cy="10" r="6" fill="#444444" stroke="#000000" stroke-width="2"/>
  <!-- Menacing Skull/Face Accents -->
  <circle cx="8" cy="9" r="1.5" fill="#FFFFFF"/>
  <circle cx="12" cy="9" r="1.5" fill="#FFFFFF"/>
  <line x1="7" y1="13" x2="13" y2="13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
